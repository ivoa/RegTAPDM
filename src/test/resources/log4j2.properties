# Set to debug or trace if log4j initialization is failing
status = warn

# Console appender configuration
appender.console.type = Console
appender.console.name = consoleLogger
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# Root logger level
rootLogger.level = info
loggers = hibernate, jboss, jdbcorm, jdbcsql

# Root logger referring to console appender
rootLogger.appenderRef.stdout.ref = consoleLogger

logger.hibernate.name = org.hibernate
logger.hibernate.level = OFF
logger.hibernate.additivity = false

logger.jboss.name = org.jboss.logging
logger.jboss.level = OFF
logger.jboss.additivity = false

logger.jdbcbind.name=org.hibernate.orm.jdbc.bind
logger.jdbcbind.level=info

logger.jdbcextract.name=org.hibernate.orm.jdbc.extract
logger.jdbcextract.level=info

logger.jdbcorm.name = org.hibernate.orm
logger.jdbcorm.level = OFF
logger.jdbcorm.additivity = false

logger.jdbcsql.name = org.hibernate.SQL
logger.jdbcsql.level = OFF
